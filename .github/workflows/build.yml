name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build APK (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm install

      - name: 🏗️ Build Web Assets (Vite)
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Direktori android belum ada, menambahkan platform android..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Berikan Izin Eksekusi Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: ⚙️ Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/NaraApp-debug.apk

      - name: ⚙️ Build Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true
          cd ..
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/NaraApp-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/NaraApp-release.apk
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaraApp-APK-${{ github.sha }}
          path: build-output/*.apk
          retention-days: 14

      - name: 🏷️ Buat GitHub Release (Jika Push Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
