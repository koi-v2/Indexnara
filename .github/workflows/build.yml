name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        # package-lock.json is stale and omits Capacitor packages; npm install reconciles it.
        run: npm install --no-audit --no-fund

      - name: 🏗️ Build Web Assets (Vite)
        run: npm run build

      - name: 🔄 Siapkan & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Direktori android belum ada, menambahkan platform android..."
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew

      - name: ⚙️ Build Debug APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/NaraApp-debug.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaraApp-Debug-APK
          path: build-output/NaraApp-debug.apk
          retention-days: 14

      - name: 🏷️ Buat GitHub Release (Jika Push Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/NaraApp-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
